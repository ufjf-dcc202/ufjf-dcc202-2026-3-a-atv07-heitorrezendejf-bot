<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dcc CSS 202 embutido</title>
    <style>
        em {
            color: orange;
            text-decoration: underline;
        }
        code {
            color: blueviolet;
            text-decoration: underline;
        }
        body > main > ol > li:nth-child(1) > code {
            color: rgb(0, 68, 255);
            background-color: aqua
        }
    </style>    
</head>
<body>
    <MAIN>
        <h1>CSS em linha</h1>
        <p> O estilo <em> em linha </em> é aplicado diretamente no elemento via atributo
        <code>style</code>. </p>
        <ol>
            <li><code>HELLO WORLD ! </code></li>
            <li><code>2+2=4 ! </code></li>            
        </ol>
    </MAIN>
</body>
</html>
